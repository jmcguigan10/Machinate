[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "machinator"
version = "0.7.0"
description = "Prompt-first control-plane CLI for ML workspaces and pipelines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "questionary>=2.1,<3",
]
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Johnny" }
]
keywords = ["cli", "mlops", "pipelines", "orchestration"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/jmcguigan10/Machinator"
Repository = "https://github.com/jmcguigan10/Machinator"
Issues = "https://github.com/jmcguigan10/Machinator/issues"

[project.scripts]
machinator = "machinator.cli:main"
macht = "machinator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
machinator = ["js/*.mjs", "guides/*.md"]

[tool.setuptools.packages.find]
where = ["src"]
